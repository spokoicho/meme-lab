<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meme Lab — създавай мемета онлайн.">
  <title>Редактор · Meme Lab</title>
</head>
<body>
  <header></header>
  <main class="container"><div id="status" role="status" aria-live="polite" hidden></div><div class="eyebrow">01 / СТУДИО</div><h1 class="page-title">Редактор<span>.</span></h1><div class="editor-grid"><div class="panel preview"><div class="panel-label">ПРЕГЛЕД <span>● НА ЖИВО</span></div><canvas id="canvas" aria-label="Преглед на мемето"></canvas><p class="preview-tip">Хвани надпис в прегледа и го премести с мишка или пръст.</p></div><form id="editor" class="panel form-stack"><h2>Твоето меме</h2><label>Изображение<select id="template" class="form-select"></select></label><label>Или качи снимка <small>PNG, JPEG, WebP · до 10 MB</small><input id="upload" type="file" accept="image/png,image/jpeg,image/webp" class="form-control"></label><label>Заглавие<input id="title" class="form-control" maxlength="100" placeholder="Име за галерията"></label><div id="captions" class="form-stack"></div>
<button id="add-caption" type="button" class="button secondary">＋ Добави надпис</button>
<div class="row g-3"><label class="col">Размер <input id="size" class="form-range" type="range" min="24" max="92" value="52"></label><label class="col-auto">Цвят<input id="color" class="form-control form-control-color" type="color" value="#ffffff"></label></div><div class="row g-3">
<label class="col-auto">Цвят на контура<input id="outline" type="color" class="form-control form-control-color" value="#17131c"></label>
<label class="col">Дебелина на контура<input id="thickness" class="form-range" type="range" min="0" max="30" value="14"></label>
</div>
<label>Подравняване<select id="align" class="form-select"><option value="left">Вляво</option><option value="center" selected>По средата</option><option value="right">Вдясно</option></select></label>
<label class="form-check"><input id="shadow" type="checkbox" class="form-check-input"> Сянка на текста</label>
<label class="form-check"><input id="public" type="checkbox" class="form-check-input"> Покажи в публичната галерия</label><div id="cloud-info" class="muted"></div><div class="actions"><button type="button" id="download" class="button secondary">↓ PNG</button><button id="save" type="submit" class="button primary" disabled>Запази</button></div></form></div></main>
  <footer></footer>
  <script type="module" src="/src/pages/editor.js"></script>
</body>
</html>
