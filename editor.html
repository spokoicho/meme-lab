<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meme Lab — създавай мемета онлайн.">
  <title>Редактор · Meme Lab</title>
</head>
<body>
  <header></header>
  <main class="container"><div id="status" role="status" aria-live="polite" hidden></div><div class="eyebrow">01 / СТУДИО</div><h1 class="page-title">Редактор<span>.</span></h1><div class="editor-grid"><div class="panel preview"><div class="panel-label">ПРЕГЛЕД <span>● НА ЖИВО</span></div><canvas id="canvas" aria-label="Преглед на мемето"></canvas></div><form id="editor" class="panel form-stack"><h2>Твоето меме</h2><label>Изображение<select id="template" class="form-select"></select></label><label>Или качи снимка <small>PNG, JPEG, WebP · до 10 MB</small><input id="upload" type="file" accept="image/png,image/jpeg,image/webp" class="form-control"></label><label>Заглавие<input id="title" class="form-control" maxlength="100" placeholder="Име за галерията"></label><label>Горен текст<input id="top" class="form-control" maxlength="140" placeholder="Когато…"></label><label>Долен текст<input id="bottom" class="form-control" maxlength="140" placeholder="…"></label><div class="row g-3"><label class="col">Размер <input id="size" class="form-range" type="range" min="24" max="92" value="52"></label><label class="col-auto">Цвят<input id="color" class="form-control form-control-color" type="color" value="#ffffff"></label></div><label class="form-check"><input id="public" type="checkbox" class="form-check-input"> Покажи в публичната галерия</label><div id="cloud-info" class="muted"></div><div class="actions"><button type="button" id="download" class="button secondary">↓ PNG</button><button id="save" type="submit" class="button primary" disabled>Запази</button></div></form></div></main>
  <footer></footer>
  <script type="module" src="/src/pages/editor.js"></script>
</body>
</html>
